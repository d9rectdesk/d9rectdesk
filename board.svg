<svg xmlns="http://www.w3.org/2000/svg" width="880" height="626" viewBox="0 0 880 626"><rect width="880" height="626" fill="#FFFFFF"/><rect width="880" height="96" fill="#102331"/><text x="28" y="42" font-family="Arial, sans-serif" font-size="30" font-weight="bold" fill="#FFFFFF">DirectDesk</text><text x="28" y="72" font-family="Arial, sans-serif" font-size="15" fill="#BFE6EA">One programmer, an AI crew of his own making, and the tools they build together</text><rect y="96" width="880" height="92" fill="#E8E8E8"/><text x="28" y="122" font-family="Arial, sans-serif" font-size="13" fill="#5A6B73">INDEPENDENCE</text><text x="28" y="156" font-family="Arial, sans-serif" font-size="26" font-weight="bold" fill="#0197A6">58%</text><rect x="120" y="146" width="150" height="10" rx="5" fill="#C9D6DA"/><rect x="120" y="146" width="87" height="10" rx="5" fill="#0197A6"/><text x="320" y="122" font-family="Arial, sans-serif" font-size="13" fill="#5A6B73">CURRENT STEP</text><text x="320" y="150" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#102331">The independence work</text><text x="320" y="174" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#0197A6">In progress</text><text x="640" y="122" font-family="Arial, sans-serif" font-size="13" fill="#5A6B73">WEBSITE</text><text x="640" y="150" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#0197A6">directdesk.net</text><rect y="188" width="880" height="86" fill="#FFFFFF"/><rect y="188" width="880" height="1" fill="#D8E2E6"/><text x="28" y="222" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#102331">Ra - the local AI crew</text><text x="852" y="222" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="end" fill="#0197A6">Live and running</text><text x="28" y="250" font-family="Arial, sans-serif" font-size="13" fill="#5A6B73">A standing team of AI agents on one local machine, writing its own programs.</text><rect y="274" width="880" height="86" fill="#FFFFFF"/><rect y="274" width="880" height="1" fill="#D8E2E6"/><text x="28" y="308" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#102331">Ra - Android companion</text><text x="852" y="308" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="end" fill="#0197A6">New version in build</text><text x="28" y="336" font-family="Arial, sans-serif" font-size="13" fill="#5A6B73">The crew's phone companion: talk to the team from anywhere.</text><rect y="360" width="880" height="86" fill="#FFFFFF"/><rect y="360" width="880" height="1" fill="#D8E2E6"/><text x="28" y="394" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#102331">DirectDesk Tools</text><text x="852" y="394" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="end" fill="#0197A6">Tool layer live</text><text x="28" y="422" font-family="Arial, sans-serif" font-size="13" fill="#5A6B73">A fleet of single-purpose tools, built and maintained by the crew.</text><rect y="446" width="880" height="86" fill="#FFFFFF"/><rect y="446" width="880" height="1" fill="#D8E2E6"/><text x="28" y="480" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#102331">The whole estate</text><text x="852" y="480" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="end" fill="#0197A6">Counted Nov 10, 2026</text><text x="28" y="508" font-family="Arial, sans-serif" font-size="13" fill="#5A6B73">160 repositories, public and private - 9,355 saves on my own projects.</text><rect y="532" width="880" height="64" fill="#102331"/><text x="28" y="552" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#BFE6EA">THE CREW</text><text x="96" y="582" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#FF2A2A">Duke</text><text x="234" y="582" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#FFEA00">Sarah</text><text x="371" y="582" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#00E5FF">Ethan</text><text x="508" y="582" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#76FF03">Kevin</text><text x="646" y="582" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#FF9F1C">Maya</text><text x="783" y="582" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#C77DFF">Iris</text><rect y="596" width="880" height="30" fill="#102331"/><text x="28" y="615" font-family="Arial, sans-serif" font-size="11" fill="#BFE6EA">Public board - basic information only. It rebuilds itself from board_data.json.</text></svg>
