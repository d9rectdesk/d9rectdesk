name: Update sponsors grid

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sponsors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Regenerate sponsors.svg
        env:
          # A personal access token belonging to the sponsored
          # account, stored as a repository secret. Sponsors data
          # answers only to the account's own token; the built-in
          # GITHUB_TOKEN cannot read it. Until the secret exists
          # the generator writes the (correct) zero-state grid.
          SPONSORS_TOKEN: ${{ secrets.SPONSORS_TOKEN }}
        run: python gen_sponsors.py
      - name: Commit the regenerated grid
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sponsors.svg
          git diff --cached --quiet || git commit -m "Regenerate sponsors grid"
          git push
